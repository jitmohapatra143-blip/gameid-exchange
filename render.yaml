services:
  - type: web
    name: gameid-exchange-backend
    env: node
    plan: free
    buildCommand: "npm install"
    startCommand: "node backend/server.mjs"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: gameid-exchange-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true

  - type: static
    name: gameid-exchange-frontend
    buildCommand: "npm install && npm run build"
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_URL
        value: "https://gameid-exchange-backend.onrender.com"
        
databases:
  - name: gameid-exchange-db
    plan: free
