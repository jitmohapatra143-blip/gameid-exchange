services:
  - type: web
    name: gameid-exchange-backend
    env: node
    plan: free
    buildCommand: "npm install"
    startCommand: "node backend/server.mjs"
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: gameid-exchange-db
          property: connectionString
      - key: JWT_SECRET
        value: "your_secret_key"

  - type: web
    name: gameid-exchange-frontend
    env: node
    plan: free
    buildCommand: "npm install && npm run build"
    startCommand: "npx serve -s dist"
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
    rootDir: frontend

databases:
  - name: gameid-exchange-db
    plan: free
    
