databases:
  - name: gameid-db
    databaseName: gameid_exchange
    user: gameid_user

services:
  - type: web
    name: gameid-backend
    env: node
    buildCommand: "npm install"
    startCommand: "npm start"
    plan: free
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: gameid-db
          property: connectionString
      - key: JWT_SECRET
        sync: false
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASS
        sync: false
        
